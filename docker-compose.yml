# DWE Cube — Docker Compose
# Includes: Cube.js API + CubeStore (router + 2 workers)
#
# Usage:
#   cp .env.example .env  # fill in secrets
#   docker compose up -d
#
# Image: remote cubejs/cube image — no local build needed.
#   Override CUBE_IMAGE in .env to use a custom registry image.
#   Override CUBE_VERSION in .env to pin a different release.
#
# Version pinning — edit .cube-version to change (passed in by justfile as CUBE_VERSION).
#
# Schema source: set CUBEJS_SCHEMA_S3_BUCKET (AWS) or
#   CUBEJS_SCHEMA_AZURE_ACCOUNT + CUBEJS_SCHEMA_AZURE_CONTAINER (Azure) in .env
#   to read schemas from object storage. CI writes schemas there via dbt-cube-sync.
#   Without these vars, schemas are read from model/cubes/ on disk.
#
# CubeStore remote storage (set in .env for production):
#   CUBESTORE_REMOTE_DIR=/cube/data            # local EBS/disk (default)
#   CUBESTORE_REMOTE_DIR=s3://bucket/cubestore  # AWS S3
#   CUBESTORE_REMOTE_DIR=azure://container/cubestore # Azure Blob

version: "3.9"

networks:
  cube_network:
    driver: bridge

services:

  # ── CubeStore — distributed pre-aggregation cache ─────────────
  # CUBE_VERSION is set from .cube-version via the justfile.
  # Set CUBESTORE_REMOTE_DIR in .env to an S3/Azure path for HA deployments.
  cubestore_router:
    image: cubejs/cubestore:${CUBE_VERSION}
    platform: linux/amd64
    restart: always
    environment:
      - CUBESTORE_WORKERS=cubestore_worker_1:10001,cubestore_worker_2:10002
      - CUBESTORE_REMOTE_DIR=${CUBESTORE_REMOTE_DIR:-/cube/data}
      - CUBESTORE_META_PORT=9999
      - CUBESTORE_SERVER_NAME=cubestore_router:9999
    volumes:
      - .cubestore:/cube/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3030/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cube_network

  cubestore_worker_1:
    image: cubejs/cubestore:${CUBE_VERSION}
    platform: linux/amd64
    restart: always
    environment:
      - CUBESTORE_WORKERS=cubestore_worker_1:10001,cubestore_worker_2:10002
      - CUBESTORE_SERVER_NAME=cubestore_worker_1:10001
      - CUBESTORE_WORKER_PORT=10001
      - CUBESTORE_REMOTE_DIR=${CUBESTORE_REMOTE_DIR:-/cube/data}
      - CUBESTORE_META_ADDR=cubestore_router:9999
    volumes:
      - .cubestore:/cube/data
    depends_on:
      cubestore_router:
        condition: service_healthy
    networks:
      - cube_network

  cubestore_worker_2:
    image: cubejs/cubestore:${CUBE_VERSION}
    platform: linux/amd64
    restart: always
    environment:
      - CUBESTORE_WORKERS=cubestore_worker_1:10001,cubestore_worker_2:10002
      - CUBESTORE_SERVER_NAME=cubestore_worker_2:10002
      - CUBESTORE_WORKER_PORT=10002
      - CUBESTORE_REMOTE_DIR=${CUBESTORE_REMOTE_DIR:-/cube/data}
      - CUBESTORE_META_ADDR=cubestore_router:9999
    volumes:
      - .cubestore:/cube/data
    depends_on:
      cubestore_router:
        condition: service_healthy
    networks:
      - cube_network

  # ── Cube.js refresh worker ─────────────────────────────────────
  cube_refresh_worker:
    image: ${CUBE_IMAGE:-cubejs/cube:${CUBE_VERSION}}
    restart: always
    env_file: .env
    environment:
      - CUBEJS_CUBESTORE_HOST=cubestore_router
      - CUBEJS_EXT_DB_TYPE=cubestore
      - CUBEJS_EXT_DB_HOST=cubestore_router
      - CUBEJS_REFRESH_WORKER=true
      - CUBEJS_DEV_MODE=false
    volumes:
      - .:/cube/conf
      - ${CUBE_SCHEMA_MOUNT:-./model/cubes}:/cube/conf/model/cubes
    depends_on:
      cubestore_router:
        condition: service_healthy
      cubestore_worker_1:
        condition: service_started
      cubestore_worker_2:
        condition: service_started
    networks:
      - cube_network

  # ── Cube.js API ────────────────────────────────────────────────
  cube_api:
    image: ${CUBE_IMAGE:-cubejs/cube:${CUBE_VERSION}}
    restart: always
    ports:
      - "4000:4000"
      - "15432:15432"
    env_file: .env
    environment:
      - CUBEJS_CUBESTORE_HOST=cubestore_router
      - CUBEJS_EXT_DB_TYPE=cubestore
      - CUBEJS_EXT_DB_HOST=cubestore_router
      - CUBEJS_DEFAULT_API_SCOPES=meta,data,graphql,jobs,sql
      - CUBEJS_DEV_MODE=false
    volumes:
      - .:/cube/conf
      - ${CUBE_SCHEMA_MOUNT:-./model/cubes}:/cube/conf/model/cubes
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4000/readyz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      cube_refresh_worker:
        condition: service_started
      cubestore_router:
        condition: service_healthy
      cubestore_worker_1:
        condition: service_started
      cubestore_worker_2:
        condition: service_started
    networks:
      - cube_network

