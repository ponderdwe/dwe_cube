# DWE Cube Adapter — Copier configuration
#
# Controls how `dwe create-service dwe_cube` (or `copier copy`) renders this adapter
# into a client repository.
#
# Rule of thumb:
#   - Value changes per CLIENT  → use {{ variable }} in a .jinja file
#   - Value changes per ENV     → use ${ENV_VAR:-default} in docker-compose / .env
#
# Only files with the .jinja extension are processed by the template engine.
# Everything else is copied verbatim.

# ─────────────────────────────────────────────────────────────────────────────
# DWE-Hub metadata — read by dwe-hub to build the adapter catalog and
# secrets reference UI. Not used by Copier template rendering.
# ─────────────────────────────────────────────────────────────────────────────
_dwe_hub:
  hub_name: cube
  display_name: "Cube.js Semantic Layer"
  description: "Cube.js semantic layer + CubeStore + Milvus vector DB + RAG FastAPI"
  icon: "boxes"
  git_providers:
    - github
    - gitlab
  cloud_providers:
    - aws
    - azure
  services:
    - name: CubeJS
      description: "Semantic layer — REST / GraphQL / WebSocket API over your data warehouse"
    - name: CubeStore
      description: "Pre-aggregation cache for sub-second query responses"
    - name: Milvus
      description: "Vector database for semantic / similarity search"
    - name: RAG FastAPI
      description: "Retrieval-augmented generation API backed by Milvus"
    - name: dbt-cube-sync
      description: "Syncs dbt models to Cube.js schema definitions automatically"
    - name: Application Load Balancer
      description: "HTTP → HTTPS redirect + HTTPS termination. Configurable as internet-facing or internal (VPC-only) via ALB_INTERNAL secret"
      kg:
        trigger_secret: ALB_SUBNET_IDS
        properties:
          endpoint: DNS_NAME
    - name: DNS
      description: "Route53 CNAME record pointing to the ALB"
      kg:
        trigger_secret: DNS_NAME
        properties:
          hostname: DNS_NAME
    - name: EC2 DNS
      description: "Route53 A record pointing directly to the EC2 instance IP — private IP for internal ALB, public IP for internet-facing"
      kg:
        trigger_secret: EC2_DNS
        properties:
          hostname: EC2_DNS
  depends_on:
    - adapter: dwe_falkordb
      required: false
      inherited_secrets: []
  kg_adapter_properties:
    vpc_id: VPC_ID
    aws_region: AWS_DEFAULT_REGION
  kg_pulumi_outputs:
    alb_endpoint: alb_dns
    url: url
    asg_name: asg_name
  ci_templates:
    github: ci-templates/github.yaml
    gitlab: ci-templates/gitlab.yaml
  # destination: ci           → add as a GitHub / GitLab repository secret
  # destination: secrets_manager → store in AWS Secrets Manager under DWE_DEPLOY_CUBE
  #
  # Pulumi reads ALL runtime config from DWE_DEPLOY_CUBE at deploy time.
  # CI only needs AWS credentials to run Pulumi and manage the autoscaling group via SSM.
  required_secrets:
    # ── CI secrets: AWS (GitHub / GitLab repository secrets) ─────────────────
    - key: AWS_ACCESS_KEY_ID
      description: "AWS access key — Pulumi uses this to provision infrastructure and trigger ASG instance refresh (AWS only)"
      destination: ci
      cloud_provider: aws
    - key: AWS_SECRET_ACCESS_KEY
      description: "AWS secret key (AWS only)"
      destination: ci
      cloud_provider: aws
    - key: PULUMI_S3_STATE
      description: "S3 URL for Pulumi state backend, e.g. s3://my-pulumi-state-bucket (AWS only)"
      destination: ci
      cloud_provider: aws

    # ── CI secrets: Azure (GitHub / GitLab repository secrets) ───────────────
    - key: AZURE_CLIENT_ID
      description: "Service principal client ID — Pulumi uses this to provision Azure infrastructure (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: AZURE_CLIENT_SECRET
      description: "Service principal client secret (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: AZURE_TENANT_ID
      description: "Azure AD tenant ID (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: AZURE_SUBSCRIPTION_ID
      description: "Azure subscription ID (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: AZURE_STORAGE_ACCOUNT
      description: "Azure Storage Account name that hosts the Pulumi state container (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: PULUMI_AZURE_STATE
      description: "Azure Blob Storage URL for Pulumi state backend, e.g. azblob://deploy-state/cube-state (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: RESOURCE_GROUP
      description: "Azure resource group name where infrastructure is deployed (Azure only)"
      destination: ci
      cloud_provider: azure
    - key: KEY_VAULT_NAME
      description: "Azure Key Vault name holding the DWE_DEPLOY_CUBE secret with all runtime config (Azure only)"
      destination: ci
      cloud_provider: azure

    # ── AWS Secrets Manager: DWE_DEPLOY_CUBE (or DWE_DEPLOY_CUBE_dev) ────────
    - key: ROUTE53_ZONE_ID
      description: "Route53 hosted zone ID (e.g. Z1D633PJN98FT9)"
      destination: secrets_manager
    - key: DNS_NAME
      description: "Public DNS name for the Cube API (e.g. cube.myorg.com)"
      destination: secrets_manager
    - key: ACM_CERTIFICATE_ARN
      description: "ACM certificate ARN for HTTPS on the ALB (must cover DNS_NAME)"
      destination: secrets_manager
    - key: VPC_ID
      description: "AWS VPC ID where the infrastructure is deployed"
      destination: secrets_manager
    - key: ALB_SUBNET_IDS
      description: "JSON array of public subnet IDs for the ALB (e.g. [\"subnet-aaa\",\"subnet-bbb\"])"
      destination: secrets_manager
    - key: KEY_NAME
      description: "EC2 key pair name for SSH access"
      destination: secrets_manager
    - key: EC2_SECURITY_GROUP_ID
      description: "Additional EC2 security group ID to attach (e.g. existing SG with DB/SSM rules)"
      destination: secrets_manager
    - key: LB_SECURITY_GROUP_ID
      description: "Security group ID to attach to the load balancer (e.g. internal SG restricting access)"
      destination: secrets_manager
    - key: ALB_INTERNAL
      description: "Set to 'true' for internal ALB (VPC-only), 'false' for internet-facing. Default: false"
      destination: secrets_manager
    - key: git_deploy_token
      description: "GitHub / GitLab token — EC2 uses this to clone the repo on first boot"
      destination: secrets_manager
    - key: git_deploy_username
      description: "GitHub / GitLab username paired with git_deploy_token for HTTPS clone (e.g. a bot account)"
      destination: secrets_manager
    - key: CUBEJS_DB_TYPE
      description: "Data warehouse driver (postgres | bigquery | snowflake | athena | redshift | trino …)"
      destination: secrets_manager
    - key: CUBEJS_DB_HOST
      description: "Data warehouse hostname"
      destination: secrets_manager
    - key: CUBEJS_DB_PORT
      description: "Data warehouse port (e.g. 5432 for Postgres)"
      destination: secrets_manager
    - key: CUBEJS_DB_NAME
      description: "Data warehouse database / catalog name"
      destination: secrets_manager
    - key: CUBEJS_DB_USER
      description: "Data warehouse username"
      destination: secrets_manager
    - key: CUBEJS_DB_PASS
      description: "Data warehouse password"
      destination: secrets_manager
    - key: CUBEJS_API_SECRET
      description: "JWT signing secret for Cube.js API — generate with: openssl rand -hex 32"
      destination: secrets_manager
    - key: SUPERSET_URL
      description: "Superset instance URL for dbt-cube-sync (e.g. https://superset.myorg.com)"
      destination: secrets_manager
    - key: SUPERSET_USERNAME
      description: "Superset username used by dbt-cube-sync"
      destination: secrets_manager
    - key: SUPERSET_PASSWORD
      description: "Superset password for the sync user"
      destination: secrets_manager
  optional_secrets:
    - key: HOSTED_ZONE_ID_EC2_DNS
      description: "Route53 hosted zone ID for the EC2 DNS record (e.g. Z1MHSQZ1OR039Y). If set, EC2_DNS must also be set."
      destination: secrets_manager
    - key: EC2_DNS
      description: "DNS name for the EC2 instance A record (e.g. cube.internal.myorg.com). Resolves to private IP when ALB is internal, public IP otherwise."
      destination: secrets_manager
    - key: OPENAI_API_KEY
      description: "OpenAI API key for Milvus RAG embeddings"
      destination: secrets_manager
    - key: DATABASE_URI
      description: "SQLAlchemy URI for dbt-cube-sync metadata (defaults to local SQLite)"
      destination: secrets_manager
    - key: AWS_DEFAULT_REGION
      description: "AWS region (defaults to us-east-1)"
      destination: secrets_manager
    - key: LLM_PROVIDER
      description: "LLM provider (openai | anthropic | bedrock | ollama)"
      destination: secrets_manager
    - key: LLM_MODEL_ID
      description: "LLM model ID"
      destination: secrets_manager
    - key: LLM_API_KEY
      description: "API key for the chosen LLM provider"
      destination: secrets_manager
    - key: KG_API_HOST
      description: "Deploy Management API host (e.g. https://deploy.dwe.myorg.com). Enables KG registration at pulumi up time."
      destination: secrets_manager
    - key: KG_API_TOKEN
      description: "Bearer token for the Deploy Management API"
      destination: secrets_manager

_templates_suffix: .jinja

_exclude:
  - copier.yml          # don't copy Copier's own config into the client repo
  - README.md           # adapter README is not for client repos
  - .git
  - .env                # never copy actual secrets
  - __pycache__
  - "*.pyc"
  - "*.pyo"
  - model               # runtime-generated by dbt-cube-sync; client starts empty
  - "pulumi/dwe-hydration.yaml"  # local dev copy; dwe-core writes the real file post-copier

_skip_if_exists:
  - .env.example        # preserve any customisations the client has already made

# ─────────────────────────────────────────────────────────────────────────────
# Questions (answered non-interactively by the dwe CLI via --data flags)
# ─────────────────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: >
    Client project slug used for cloud resource naming (EC2, IAM roles, Route53).
    Use lowercase letters, numbers, and hyphens only.
    Example: acme-cube, my-org-semantic-layer
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]+$')) %}Must be lowercase letters, numbers, hyphens{% endif %}"

git_repo_url:
  type: str
  default: ""
  when: false   # always set programmatically by dwe CLI

adapter_name:
  type: str
  default: dwe_cube
  when: false   # always set programmatically by dwe CLI

adapter_version:
  type: str
  default: v1.0.0
  when: false   # always set programmatically by dwe CLI

environments:
  type: yaml
  default: "[dev, prod]"
  help: "List of deployment environments (each gets its own Pulumi stack and CI job)"

cloud_provider:
  type: str
  default: aws
  choices:
    - aws
    - azure
  help: "Cloud provider for infrastructure deployment"
  when: false   # always set programmatically by dwe CLI

azure_location:
  type: str
  default: eastus
  help: "Azure region where infrastructure is provisioned (only used when cloud_provider=azure)"
  when: false   # always set programmatically by dwe CLI

aws_region:
  type: str
  default: us-east-1
  help: "AWS region where infrastructure is provisioned"
  x_dwe_editable: true
  x_dwe_per_env: false

instance_type:
  type: str
  default: t3.xlarge
  help: >
    VM instance size. Cube.js + CubeStore + Milvus are memory-intensive.
    AWS: t3.xlarge or r6i.large. Azure: Standard_D4s_v6 or Standard_E4s_v6.
  x_dwe_editable: true
  x_dwe_per_env: true

volume_size:
  type: int
  default: 100
  help: "Root volume size in GB. Milvus vector index can grow large."
  x_dwe_editable: true
  x_dwe_per_env: true

secret_id:
  type: str
  default: "DWE_DEPLOY_CUBE"
  help: >
    Secret name holding all runtime credentials.
    Per-environment stacks append a suffix automatically: DWE_DEPLOY_CUBE_dev, DWE_DEPLOY_CUBE_prod.
  x_dwe_editable: true
  x_dwe_per_env: false
